name: keepalive
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.SITE_URL != '' }}
    steps:
      - name: Ping web va co so du lieu
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS --max-time 90 "${{ vars.SITE_URL }}/api/health?db_check=true"; then exit 0; fi
            echo "Chua tra loi, thu lai sau 30 giay"; sleep 30
          done
          exit 1
